name: Squig Mad Libs verification
on:
  push:
    branches: [feature/squig-madlibs]
  pull_request:
    branches: [main]
    paths:
      - 'modules/madlib*'
      - 'modules/data/madlibScenes*.js'
      - 'scripts/*Madlib*.js'
      - 'scripts/madlibTestUtils.js'
      - 'docs/squig-madlibs*'
      - 'index.js'
      - 'package.json'
      - '.github/workflows/madlib-verification.yml'
permissions:
  contents: read
concurrency:
  group: madlib-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: madlib_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: madlib_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MADLIB_ENABLED: 'false'
      MADLIB_TEST_DATABASE_URL: postgres://madlib_test:isolated_test_only@localhost:5432/madlib_test
      MADLIB_TEST_DATABASE_ALLOW_RESET: 'true'
      MADLIB_REPORT_DIR: madlib-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the unchanged declared compatibility baseline
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund discord.js@14.16.3 pg@8.12.0 node-fetch@2.6.7 @napi-rs/canvas@0.1.66 ethers@6.10.0 dotenv@16.4.5
      - name: Require full documentation and execute every verification suite
        run: |
          test -s docs/squig-madlibs.md
          node scripts/runMadlibChecks.js
      - name: Attach exact verification and commit details
        if: always()
        run: |
          mkdir -p madlib-ci
          git rev-parse HEAD > madlib-ci/commit.txt
          node --version > madlib-ci/runtime.txt
          if test -f madlib-ci/verification.md; then cat madlib-ci/verification.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madlib-verification
          path: madlib-ci/
          retention-days: 7
