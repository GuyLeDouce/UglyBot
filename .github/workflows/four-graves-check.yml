name: Four Graves checks
on:
  pull_request:
    paths: ['modules/fourGraves*', 'scripts/testFourGraves*', 'scripts/fourGravesDiscordFixture.js', 'package.json', 'index.js', '.github/workflows/four-graves-check.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: four_graves_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: node --check index.js && npm run test:trick-or-treat && npm run test:four-graves
      - run: npm run test:four-graves-db
        env:
          FOUR_GRAVES_TEST_DATABASE_URL: postgres://postgres:test_only@localhost:5432/four_graves_test
